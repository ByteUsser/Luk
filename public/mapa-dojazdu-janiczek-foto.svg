<svg width="1100" height="680" viewBox="0 0 1100 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orientacyjny obszar dojazdu Janiczek Foto</title>
  <desc id="desc">Mapa poglądowa okolic Bochni, Krakowa, Limanowej i Tarnowa z zaznaczonym obszarem dojazdu.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1100" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#304936"/>
      <stop offset="0.42" stop-color="#59613d"/>
      <stop offset="0.72" stop-color="#263a2f"/>
      <stop offset="1" stop-color="#151f1b"/>
    </linearGradient>
    <radialGradient id="cityGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 238) rotate(20) scale(240 150)">
      <stop stop-color="#c7b793" stop-opacity="0.58"/>
      <stop offset="0.58" stop-color="#7b7352" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#27362d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bochniaGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(575 310) rotate(12) scale(180 118)">
      <stop stop-color="#b7b089" stop-opacity="0.42"/>
      <stop offset="0.7" stop-color="#546042" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#27362d" stop-opacity="0"/>
    </radialGradient>
    <filter id="satelliteNoise" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.018" numOctaves="5" seed="18"/>
      <feColorMatrix type="matrix" values="0.46 0 0 0 0.06 0 0.52 0 0 0.12 0 0 0.38 0 0.06 0 0 0 0.42 0"/>
      <feBlend mode="overlay" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#07100d" flood-opacity="0.45"/>
    </filter>
    <filter id="labelStroke" x="-20%" y="-80%" width="140%" height="260%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="DILATED"/>
      <feFlood flood-color="#121817" flood-opacity="0.78" result="OUTLINE"/>
      <feComposite in="OUTLINE" in2="DILATED" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1100" height="680" rx="34" fill="url(#base)"/>
  <rect width="1100" height="680" rx="34" fill="url(#cityGlow)"/>
  <rect width="1100" height="680" rx="34" fill="url(#bochniaGlow)"/>
  <rect width="1100" height="680" rx="34" filter="url(#satelliteNoise)" opacity="0.78"/>

